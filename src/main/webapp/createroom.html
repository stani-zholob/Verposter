<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Raum erstellen</title>
</head>
<body style="text-align: center;">

<h1>VERPOSTER</h1>

<h2>Erstelle einen Raum</h2>

<p>
<form id = "create-room" action = "/Verposter/api/rooms/" method = "post">

    <label for="name">Name</label><br>
    <input type="text" id="name" name="name" maxlength="20"required>

    </p>

    <button> Erstellen </button>
</form>

<script>
    const form = document.getElementById("create-room");
    form.addEventListener("submit",async (event) => {event.preventDefault()

    const resp = await fetch("/Verposter/api/rooms/", {
        method:"POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: form.elements.name.value
        })
    });
    if (resp.ok){
        window.location.href = "/Verposter/lobby";
    } else{
        console.error("Room scheisse");
    }
    });
</script>
</body>
</html>
