<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Deine Karte</title>
</head>
<body style="text-align: center;">

<h1>VERPOSTER</h1>

<p>The word is</p>
<h2 id="word"> </h2>
<!--<input id="message-input" type="text"> -->
<button id="send-button">Zeige mein Wort</button>


<script>
    const socket = new WebSocket("ws://localhost:8080/Verposter/ws");

    socket.onopen = () => {
        console.log("verbunden")
    }
    socket.onmessage = (event) => {
        document.getElementById("word").textContent = event.data;
    }
    socket.onclose = () => {
        console.log("geschlossen");
    }
    document.getElementById("send-button").onclick = () => {
        const message = document.getElementById("send-button").value;
        socket.send(message);
    };
</script>
</body>
</html>
