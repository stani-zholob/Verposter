<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Deine Karte</title>
</head>
<body style="text-align: center;">

<h1>VERPOSTER</h1>

<p>Das Wort ist</p>
<h2 id="word"> </h2>


<input id="message" type="text" placeholder="Schreibe eine Nachricht">
<button onclick="send()">Senden</button>
<div id="chat"></div>

<script>
    const roomId = new URLSearchParams(window.location.search).get("roomId")
    const socket = new WebSocket(`ws://localhost:8080/Verposter/ws/rooms/${roomId}`);

    socket.onopen = () => {
        console.log("verbunden")
    }
    socket.onmessage = (event) => {
        if (event.data.startsWith("CARD:")) {
            document.getElementById("word").textContent = event.data.substring(5);
        }

        if (event.data.startsWith("CHAT:")) {
            const message = document.createElement("p");
            message.textContent = event.data.substring(5);
            document.getElementById("chat").append(message);
        }
    }

    function send(){
        const input = document.getElementById("message");
        const message = input.value.trim();

        if (message === "") {
            return;
        }

        socket.send(message);
        input.value = "";
    }
    socket.onclose = () => {
        console.log("geschlossen");
    }
</script>
</body>
</html>
