<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Deine Karte</title>
</head>
<body style="text-align: center;">

<h1>VERPOSTER</h1>

<p>Das Wort ist</p>
<h2 id="word"> </h2>

<script>
    const socket = new WebSocket("ws://localhost:8080/Verposter/ws");

    socket.onopen = () => {
        console.log("verbunden")
    }
    socket.onmessage = (event) => {
        document.getElementById("word").textContent = event.data;
    }
    socket.onclose = () => {
        console.log("geschlossen");
    }
</script>
</body>
</html>
