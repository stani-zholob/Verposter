<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Lobby</title>
</head>
<body style="text-align: center;">

<h1>VERPOSTER</h1>
<h2>Lobby</h2>

<form action = "/Verposter/createroom" method = "get">
    <p><button type="submit">+ Neuer Raum</button></p></form>


<table border="1" cellpadding="5" style="margin: 0 auto;">
    <thead>
        <tr>
            <th>Raum</th>
            <th>Name</th>
            <th>Beitreten</th>
        </tr>
    </thead>

    <tbody id="rooms-table">

    </tbody>
</table>
<form action="/Verposter/logout" method="get">
<br> <button>Ausloggen</button>
</form>
<script>
    async function getRooms(){
        const resp = await fetch('/Verposter/api/rooms');
        const rooms = await resp.json();
        console.log(rooms);


        const table = document.getElementById("rooms-table");
        for(const room of rooms){
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${room.id}</td>
                <td>${room.name}</td>
                <td>
                        <form action="/Verposter/api/rooms/${room.id}/members" method="post">
                            <button type="submit"> Beitreten </button>
                    </form>
                </td> `;
            table.append(row);
        }
    }
    getRooms();
</script>

</body>
</html>
