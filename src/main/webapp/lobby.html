<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Lobbies</title>
</head>
<body>

<h1>VERPOSTER</h1>

<h2>Lobbies</h2>

<p><button type="button">+ Neue Lobby</button></p>



<table border="1" cellpadding="5">
    <thead>
        <tr>
            <th>Raum</th>
            <th>Name</th>
            <th>Spieler</th>

        </tr>
    </thead>

    <tbody id="rooms-table">

    </tbody>
</table>

<script>
    async function getRooms(){
        const resp = await fetch('/Verposter/api/rooms');
        const rooms = await resp.json();
        console.log(rooms);


        const table = document.getElementById("rooms-table");
        for(const room of rooms){
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${room.id}</td>
                <td>${room.name}</td>
                <td> <button type="button"> Beitreten </button> </td>`;
            table.append(row);
        }
    }
    getRooms();
</script>

</body>
</html>
