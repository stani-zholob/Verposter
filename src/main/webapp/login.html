<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Anmelden</title>
</head>
<body style="text-align: center;">

<h1>VERPOSTER</h1>

<h2>Anmelden</h2>
<form id="login-form" action = "login" method = "post">
    <label for="username">Benutzername</label><br>
    <input type="text" id="username" name="username" maxlength="20"required><br>

    <label for="password">Passwort</label><br>
    <input type="password" id="password" name="password" maxlength="20" required><br><br>

    <button> Anmelden </button>&nbsp;&nbsp;
    <button type="button" onclick="location.href='register'"> Zur Registrierung </button>
</form>

<script>
    const form = document.getElementById("login-form");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const resp = await fetch("login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
                name: username,
                password: password
            })
        });

        if (resp.ok) {
            window.location.href = "lobby";
        } else if (resp.status === 401) {
            alert("Falscher Benutzername oder Passwort");
        } else {
            alert("Server Fehler");
        }
    });
</script>
</body>
</html>
