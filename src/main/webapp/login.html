
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Sign In</title>
</head>
<body>

<h1>VERPOSTER</h1>

<h2>Sign In</h2>

<p>
    <form action = "/Verposter/login" method = "post">

    <label for="username">Your Username</label><br>
    <input type="text" id="username" name="username" maxlength="20"required>

    <label for="password"></label><br>
    <input type="text" id="password" name="password" maxlength="20" required>

</p>

<button> Login </button>
</form>



<form action = "/register" method = "get">
<button> Register </button>
</form>

</body>
</html>
