<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Sign In</title>
</head>
<body style="text-align: center;">

<h1>VERPOSTER</h1>

<h2>Anmelden</h2>

<p>
    <form id="login-form" action = "/Verposter/login" method = "post">

    <label for="username">Benutzername</label><br>
    <input type="text" id="username" name="username" maxlength="20"required><br>

    <label for="password">Passwort</label><br>
    <input type="password" id="password" name="password" maxlength="20" required>
</p>

<button> Anmelden </button>
</form>



<script>
    const form = document.getElementById("login-form");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const resp = await fetch("/Verposter/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
                name: username,
                password: password
            })
        });

        if (resp.ok) {
            window.location.href = "/Verposter/lobby";
        } else if (resp.status === 401) {
            alert("Falscher Benutzername oder Passwort");
        } else {
            alert("Server Fehler");
        }
    });
</script>

<br>
<form action = "/Verposter/register" method = "get">
<button> Zur Registrierung </button>
</form>

</body>
</html>
