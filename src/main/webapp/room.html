<!DOCTYPE html>

<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter</title>
</head>
<body style="text-align: center;">


<h1>VERPOSTER</h1>


<p>Warten auf die anderen Spieler </p>
<table border="1" cellpadding="5" style="margin: 0 auto;">
    <thead>
    <tr>
        <th>Nr</th>
        <th>Spieler</th>
        <th>Bereit</th>
    </tr>
    </thead>

    <tbody id="users-table">

    </tbody>
</table>

<p>Themen</p>
<table border="1" cellpadding="5" style="margin: 0 auto;">
    <thead>
    <tr>
        <th>Nr</th>
        <th>Thema</th>
    </tr>
    </thead>

    <tbody id="topics-table">

    </tbody>
</table>

<p><button type="button" id="ready-button">Bereit</button>&nbsp;&nbsp;&nbsp;&nbsp;<button type="button" id="leave-button">Verlassen</button></p>

<script>
    const ROOM_ID = new URLSearchParams(window.location.search).get("roomId");

    async function getMembers(){
        const resp = await fetch(`api/rooms/${ROOM_ID}/members`);
        const members = await resp.json();

        const table = document.getElementById("users-table");
        table.innerHTML = "";
        let index = 1;
        for(const member of members){
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${index++}</td>
                <td>${member.name}</td>
                <td>${member.ready ? "&#10003;" : "&#10007;"}</td>`;
            table.append(row);
        }

        if (members.length >= 3 && members.every(m => m.ready)) {
            window.location.href = `game.html?roomId=${ROOM_ID}`;
        }
    }

    document.getElementById("ready-button").addEventListener("click", async function () {
        const resp = await fetch(`api/rooms/${ROOM_ID}/members/ready`, {
            method: "PATCH"
        });
        if (!resp.ok) {
            return;
        }
        await getMembers();
    });

    document.getElementById("leave-button").addEventListener("click", async function () {
        const resp = await fetch(`api/rooms/${ROOM_ID}/members/leave`, {
            method: "DELETE"
        });
        if (!resp.ok) {
            return;
        }
        window.location.href = "lobby";
    });

    async function getTopics(){
        const resp = await fetch(`api/topics`);
        const topics = await resp.json();

        const table = document.getElementById("topics-table");
        table.innerHTML = "";
        let index = 1;
        for(const topic of topics){
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${index++}</td>
                <td>${topic.name}</td>`;
            table.append(row);
        }
    }

    getMembers();
    getTopics();
    setInterval(getMembers, 2000);
</script>
</body>
</html>
