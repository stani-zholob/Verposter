<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Registrieren</title>
</head>
<body style="text-align: center;">

<h1>VERPOSTER</h1>

<h2>Registrieren</h2>

<p>
<form id="reg-form" action = "/Verposter/register" method = "post">

    <label for="username">Benutzername</label><br>
    <input type="text" id="username" name="username" maxlength="20"><br>

    <label for="password">Passwort</label><br>
    <input type="password" id="password" name="password" maxlength="20">

</p>
<button>Registrieren</button>
</form>
<br>
<form action="/Verposter/login" method = "get">
<button>Zur Anmeldung</button>
</form>

    <script>
        const form = document.getElementById("reg-form");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/Verposter/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    name: username,
                    password: password
                })
            });

            if (response.ok) {
                window.location.href = "/Verposter/login"
            } else if (response.status === 409) {
                alert("Der Bneutzername ist bereits vergeben");
            } else if (response.status === 401) {
                alert("Falscher Benutzername oder Passwort");
            } else {
                alert("Server Fehler");
            }
        });

    </script>

</body>
</html>
