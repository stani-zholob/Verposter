<!DOCTYPE html>

<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter - Bereit?</title>
</head>
<body>

<h1>VERPOSTER</h1>


<p>Warten auf die anderen Spieler </p>
<table border="1" cellpadding="5">
    <thead>
    <tr>
        <th>Id</th>
        <th>Player</th>

    </tr>
    </thead>

    <tbody id="users-table">

    </tbody>
</table>

<script>
    async function getUsers(){
        const resp = await fetch('/Verposter/api/users');
        const users = await resp.json();
        console.log(users);


        const table = document.getElementById("users-table");
        for(const user of users){
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${user.id}</td>
                <td>${user.name}</td>
                <td> <form action = "/showcard.html" method = "get"> <button type="button" name = "ready"> Ready </button> </form> </td>`;
            table.append(row);
        }
    }
    getUsers();
</script>

<form action="/showcard.html", ></form>
<p><button type="button">ready</button></p>


</body>
</html>
