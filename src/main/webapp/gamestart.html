<!DOCTYPE html>

<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verposter</title>
</head>
<body style="text-align: center;">


<h1>VERPOSTER</h1>


<p>Warten auf die anderen Spieler </p>
<table border="1" cellpadding="5" style="margin: 0 auto;">
    <thead>
    <tr>
        <th>Nr</th>
        <th>Spieler</th>
        <th>Bereit</th>
    </tr>
    </thead>

    <tbody id="users-table">

    </tbody>
</table>

<script>
    async function getMembers(){
        const resp = await fetch('/Verposter/api/rooms/0/members');
        const members = await resp.json();
        console.log(members);

        const table = document.getElementById("users-table");
        for(const member of members){
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${member.id}</td>
                <td>${member.name}</td>
                <td>${member.isReady}</td>`;
            table.append(row);
        }
    }
    getMembers();
</script>

<form action="/showcard.html", ></form>
<p><button type="button">Bereit</button></p>


</body>
</html>
